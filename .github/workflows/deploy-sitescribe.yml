name: Deploy SiteScribe

# First deployment is manual so the scoped FTP account and public path can be
# verified before enabling deployment on every push to main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitescribe-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy the flat Review Console
    runs-on: ubuntu-latest
    env:
      FTP_URL: ${{ secrets.SITESCRIBE_FTP_URL }}
      FTP_USER: ${{ secrets.SITESCRIBE_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.SITESCRIBE_FTP_PASSWORD }}
      PUBLIC_URL: https://www.ecrinc.ca/sitescribe
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment inputs and release files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FTP_URL" != 'ftp://server292.com/' || "$FTP_USER" != 'sitescribe_deploy' || -z "$FTP_PASSWORD" ]]; then
            echo 'Check the three SITESCRIBE_FTP_* repository secrets. URL must be ftp://server292.com/ and user sitescribe_deploy.' >&2
            exit 1
          fi
          files=(app.js dropbox-sync-proof.js exceljs.min.js index.html sitescribe-parser-core.js sitescribe-add-data.js sitescribe-hours-excel.js sitescribe-mds-excel.js styles.css)
          for file in "${files[@]}"; do
            test -s "$file" || { echo "Missing or empty release file: $file" >&2; exit 1; }
          done
          for file in app.js dropbox-sync-proof.js sitescribe-parser-core.js sitescribe-add-data.js sitescribe-hours-excel.js sitescribe-mds-excel.js; do
            node --check "$file"
          done
          grep -q 'SiteScribe Review Console v' index.html

      - name: Upload supporting files
        shell: bash
        run: |
          set -euo pipefail
          files=(app.js dropbox-sync-proof.js exceljs.min.js sitescribe-parser-core.js sitescribe-add-data.js sitescribe-hours-excel.js sitescribe-mds-excel.js styles.css)
          for file in "${files[@]}"; do
            echo "Uploading $file"
            curl --fail --silent --show-error --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" \
              --upload-file "$file" "${FTP_URL}${file}"
          done

      - name: Verify supporting files on the website
        shell: bash
        run: |
          set -euo pipefail
          files=(app.js dropbox-sync-proof.js exceljs.min.js sitescribe-parser-core.js sitescribe-add-data.js sitescribe-hours-excel.js sitescribe-mds-excel.js styles.css)
          for file in "${files[@]}"; do
            echo "Verifying $file"
            curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' \
              "${PUBLIC_URL}/${file}?deploy=${GITHUB_SHA}" --output "/tmp/sitescribe-${file}"
            cmp "$file" "/tmp/sitescribe-${file}"
          done

      - name: Upload the page last
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" \
            --upload-file index.html "${FTP_URL}index.html"

      - name: Verify the live page
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' \
            "${PUBLIC_URL}/?deploy=${GITHUB_SHA}" --output /tmp/sitescribe-index.html
          cmp index.html /tmp/sitescribe-index.html
