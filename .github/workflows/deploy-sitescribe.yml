name: Deploy SiteScribe

# Deploy only when the flat Review Console files change on main. Keep a manual
# trigger for redeploys and recovery.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-sitescribe.yml
      - app.js
      - dropbox-sync-proof.js
      - exceljs.min.js
      - index.html
      - sitescribe-parser-core.js
      - sitescribe-add-data.js
      - sitescribe-hours-excel.js
      - sitescribe-mds-excel.js
      - styles.css
      - sitescribe-report-pdf.js
      - pdfmake.min.js
      - vfs_fonts.js
      - pdfmake.LICENSE.txt
      - Roboto.LICENSE.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitescribe-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy the flat Review Console
    runs-on: ubuntu-latest
    env:
      FTP_URL: ${{ secrets.SITESCRIBE_FTP_URL }}
      FTP_USER: ${{ secrets.SITESCRIBE_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.SITESCRIBE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment inputs and release files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FTP_URL" != 'ftp://server292.com/' || "$FTP_USER" != 'sitescribe_deploy' || -z "$FTP_PASSWORD" ]]; then
            echo 'Check the three SITESCRIBE_FTP_* repository secrets. URL must be ftp://server292.com/ and user sitescribe_deploy.' >&2
            exit 1
          fi
          files=(app.js dropbox-sync-proof.js exceljs.min.js index.html sitescribe-parser-core.js sitescribe-add-data.js sitescribe-hours-excel.js sitescribe-mds-excel.js styles.css sitescribe-report-pdf.js pdfmake.min.js vfs_fonts.js pdfmake.LICENSE.txt Roboto.LICENSE.txt)
          for file in "${files[@]}"; do
            test -s "$file" || { echo "Missing or empty release file: $file" >&2; exit 1; }
          done
          for file in app.js dropbox-sync-proof.js sitescribe-parser-core.js sitescribe-add-data.js sitescribe-hours-excel.js sitescribe-mds-excel.js sitescribe-report-pdf.js; do
            node --check "$file"
          done
          grep -q 'SiteScribe Review Console v' index.html

      - name: Confirm the FTP root is SiteScribe
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" \
            "${FTP_URL}index.html" --output /tmp/sitescribe-existing-index.html
          grep -q 'SiteScribe Review Console v' /tmp/sitescribe-existing-index.html

      - name: Upload supporting files
        shell: bash
        run: |
          set -euo pipefail
          files=(app.js dropbox-sync-proof.js exceljs.min.js sitescribe-parser-core.js sitescribe-add-data.js sitescribe-hours-excel.js sitescribe-mds-excel.js styles.css sitescribe-report-pdf.js pdfmake.min.js vfs_fonts.js pdfmake.LICENSE.txt Roboto.LICENSE.txt)
          for file in "${files[@]}"; do
            echo "Uploading $file"
            curl --fail --silent --show-error --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" \
              --upload-file "$file" "${FTP_URL}${file}"
          done

      - name: Verify supporting files through FTP
        shell: bash
        run: |
          set -euo pipefail
          files=(app.js dropbox-sync-proof.js exceljs.min.js sitescribe-parser-core.js sitescribe-add-data.js sitescribe-hours-excel.js sitescribe-mds-excel.js styles.css sitescribe-report-pdf.js pdfmake.min.js vfs_fonts.js pdfmake.LICENSE.txt Roboto.LICENSE.txt)
          for file in "${files[@]}"; do
            echo "Verifying $file"
            curl --fail --silent --show-error --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" \
              "${FTP_URL}${file}" --output "/tmp/sitescribe-${file}"
            cmp "$file" "/tmp/sitescribe-${file}"
          done

      - name: Upload the page last
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" \
            --upload-file index.html "${FTP_URL}index.html"

      - name: Verify the uploaded page through FTP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" \
            "${FTP_URL}index.html" --output /tmp/sitescribe-index.html
          cmp index.html /tmp/sitescribe-index.html
